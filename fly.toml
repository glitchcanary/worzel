# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'worzel'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = 'production'
  WORZEL_HOST = '0.0.0.0'
  WORZEL_PORT = '3000'
  WORZEL_LLM_PROVIDER = 'openai'
  WORZEL_LLM_URL = 'https://api.openai.com/v1/chat/completions'
  WORZEL_LLM_MODEL = 'gpt-4o-mini'
  FINK_TTS_PROVIDER = 'elevenlabs'
  FINK_TTS_MODEL = 'eleven_multilingual_v2'
  FINK_TTS_VOICE = 'wG54O0fjDbPBYb9MFXCb'
  WORZEL_CORS_ORIGINS = 'http://localhost:8000,http://localhost:3000'
  FINK_DEFAULT_STORY = 'bigtop-briefing'

# Persistent volume for TTS audio cache (survives deploys and restarts).
# One volume per machine is required. Create with:
#   fly volumes create tts_cache --size 1 --region iad -y
# Repeat for each machine (fly scale show to check count).
[mounts]
  source = 'tts_cache'
  destination = '/app/tmp/tts-cache'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
