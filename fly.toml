# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'worzel'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = 'production'
  WORZEL_HOST = '0.0.0.0'
  WORZEL_PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
