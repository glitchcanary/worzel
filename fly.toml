# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'worzel'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = 'production'
  WORZEL_HOST = '0.0.0.0'
  WORZEL_PORT = '3000'
  # LLM — Anthropic Claude for story routing
  WORZEL_LLM_PROVIDER = 'anthropic'
  WORZEL_LLM_URL = 'https://api.anthropic.com/v1/messages'
  WORZEL_LLM_MODEL = 'claude-haiku-4-5-20251001'
  WORZEL_LLM_SMART_PROVIDER = 'anthropic'
  WORZEL_LLM_SMART_MODEL = 'claude-opus-4-6'
  # ASR — Groq Whisper for server-side speech recognition
  WORZEL_ASR_PROVIDER = 'groq'
  WORZEL_ASR_URL = 'https://api.groq.com/openai/v1/audio/transcriptions'
  WORZEL_ASR_MODEL = 'whisper-large-v3-turbo'
  WORZEL_ASR_LANGUAGE = 'en'
  # TTS — OpenAI as base (fallback), ElevenLabs as Fink primary
  WORZEL_TTS_PROVIDER = 'openai'
  WORZEL_TTS_MODEL = 'gpt-4o-mini-tts'
  WORZEL_TTS_VOICE = 'ballad'
  FINK_TTS_PROVIDER = 'elevenlabs'
  FINK_TTS_MODEL = 'eleven_multilingual_v2'
  FINK_TTS_VOICE = 'wG54O0fjDbPBYb9MFXCb'
  # Supabase auth (experimental) — set via `fly secrets set`
  # WORZEL_SUPABASE_URL, WORZEL_SUPABASE_ANON_KEY, WORZEL_SUPABASE_JWT_SECRET
  # General
  WORZEL_CORS_ORIGINS = 'http://localhost:8000,http://localhost:3000'
  FINK_DEFAULT_STORY = 'menu'
  # Hosts allowed to serve external .fink.js stories. One string; separate
  # several hosts with commas ('a.example, b.example'). Bare host names only:
  # no scheme, path or port; exact match, no wildcards; HTTPS required.
  FINK_EXTERNAL_HOSTS = 'danbri.github.io'

# Persistent volume for TTS audio cache (survives deploys and restarts).
# One volume per machine is required. Create with:
#   fly volumes create tts_cache --size 1 --region iad -y
# Repeat for each machine (fly scale show to check count).
[mounts]
  source = 'tts_cache'
  destination = '/app/tmp/tts-cache'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
