; PlatformIO configuration for Worzel ESP32 Client (ESP-IDF framework)
;
; Usage:
;   pio run -e esp32s3-amoled -t upload    # Waveshare ESP32-S3 1.8" AMOLED
;   pio run -e esp32c3-xmini -t upload     # xmini-c3-v3
;   pio run -e esp32c6-lcd -t upload       # Waveshare ESP32-C6 1.69" LCD
;
; Board pin configs selected via build_flags -DBOARD_xxx

[platformio]
default_envs = esp32s3-amoled

[common]
platform = espressif32@^6.9.0
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Warning suppressions for micro-opus are in src/CMakeLists.txt (idf_build_set_property)
; GCC 14 ICE workaround for esp_lcd also in CMakeLists.txt (per-file -O0)
;
; WiFi credentials: put real values in sdkconfig.local (gitignored), not sdkconfig.defaults.
; ESP-IDF reads defaults first, then flash-size override, then local overrides.
; Flash size is per-board (sdkconfig.flash-16mb or sdkconfig.flash-4mb).

; --- Waveshare ESP32-S3 1.8" AMOLED (recommended first target) ---
[env:esp32s3-amoled]
extends = common
board = esp32-s3-devkitc-1
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.flash-16mb;sdkconfig.local"
build_flags =
    -DBOARD_WAVESHARE_S3_AMOLED_1_8
    -DBOARD_HAS_PSRAM

; --- xmini-c3-v3 ---
[env:esp32c3-xmini]
extends = common
board = esp32-c3-devkitm-1
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.flash-4mb;sdkconfig.local"
build_flags =
    -DBOARD_XMINI_C3_V3

; --- Waveshare ESP32-C6 1.69" LCD ---
[env:esp32c6-lcd]
extends = common
board = esp32-c6-devkitc-1
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.flash-4mb;sdkconfig.local"
build_flags =
    -DBOARD_WAVESHARE_C6_LCD_1_69
