; PlatformIO configuration for Worzel ESP32 Client (ESP-IDF framework)
;
; Usage:
;   pio run -e esp32s3-amoled -t upload    # Waveshare ESP32-S3 1.8" AMOLED
;   pio run -e esp32c3-xmini -t upload     # xmini-c3-v3
;   pio run -e esp32c6-lcd -t upload       # Waveshare ESP32-C6 1.69" LCD
;
; Board pin configs selected via build_flags -DBOARD_xxx

[platformio]
default_envs = esp32s3-amoled

[common]
platform = espressif32@^6.9.0
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; --- Waveshare ESP32-S3 1.8" AMOLED (recommended first target) ---
[env:esp32s3-amoled]
extends = common
board = esp32-s3-devkitc-1
build_flags =
    -DBOARD_WAVESHARE_S3_AMOLED_1_8
    -DBOARD_HAS_PSRAM
board_build.partitions = default_16MB.csv
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

; --- xmini-c3-v3 ---
[env:esp32c3-xmini]
extends = common
board = esp32-c3-devkitm-1
build_flags =
    -DBOARD_XMINI_C3_V3

; --- Waveshare ESP32-C6 1.69" LCD ---
[env:esp32c6-lcd]
extends = common
board = esp32-c6-devkitc-1
build_flags =
    -DBOARD_WAVESHARE_C6_LCD_1_69
