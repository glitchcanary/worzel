<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Set content="on" to enable Gaussian splat rendering (experimental) -->
  <meta name="fink:gaussians" content="off" />
  <title>Fink — Voice Interactive Fiction</title>
  <link rel="icon" href="./favicon.ico" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1a2e;
      font-family: 'Georgia', 'Times New Roman', serif;
      padding: 20px;
    }
    #stage-panel {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    #stage-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* fink-app lives in a stage window (stage-boot.js) and fills it. */
    fink-app {
      width: 100%;
      height: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      --fink-bg: #16213e;
      --fink-header-bg: #0f3460;
      --fink-text: #e8e8e8;
      --fink-text-secondary: #8b8fa3;
      --fink-text-muted: #5a5e73;
      --fink-border: #1a1a3e;
      --fink-narration-bg: #1a2744;
      --fink-choice-bg: #1e3a5f;
      --fink-choice-hover: #264d7a;
      --fink-choice-active: #2d6aa0;
      --fink-user-bg: #533483;
      --fink-accent: #e94560;
      --fink-primary: #0f3460;
    }
  </style>
</head>
<body>
  <div id="stage-panel">
    <canvas id="stage-canvas"></canvas>
  </div>
  <script type="module" src="sb-auth.js"></script>
  <script type="module" src="fink.js?v=6"></script>
  <script type="module" src="stage-boot.js"></script>
</body>
</html>
