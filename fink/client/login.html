<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fink — Sign In</title>
  <link rel="icon" href="./favicon.ico" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1a2e;
      font-family: 'Georgia', 'Times New Roman', serif;
      padding: 20px;
      color: #e8e8e8;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: #16213e;
      border-radius: 12px;
      padding: 40px 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .login-card h1 {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: #e94560;
    }
    .login-card .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #8b8fa3;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #8b8fa3;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #1a1a3e;
      border-radius: 8px;
      background: #1a2744;
      color: #e8e8e8;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #0f3460;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-primary {
      background: #0f3460;
      color: #e8e8e8;
    }
    .btn-primary:hover { background: #1a4a7a; }
    .btn-secondary {
      background: transparent;
      color: #8b8fa3;
      border: 1px solid #1a1a3e;
      margin-top: 12px;
    }
    .btn-secondary:hover { background: #1a2744; }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: #5a5e73;
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #1a1a3e;
    }
    .divider span { padding: 0 12px; }
    .message {
      text-align: center;
      font-size: 0.85rem;
      margin-top: 16px;
      min-height: 20px;
    }
    .message.error { color: #e94560; }
    .message.success { color: #4ecdc4; }
    .experimental-badge {
      display: inline-block;
      background: #e94560;
      color: #fff;
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      vertical-align: middle;
      margin-left: 8px;
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab { flex: 1; padding: 8px; cursor: pointer; background: #333; border: 1px solid #555; color: #ccc; border-radius: 4px; }
    .tab.active { background: #555; color: #fff; border-color: #888; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Fink <span class="experimental-badge">Experimental</span></h1>
    <p class="subtitle">Voice Interactive Fiction</p>

    <div class="tabs">
      <button id="tab-signin" class="tab active">Sign In</button>
      <button id="tab-register" class="tab">Register</button>
    </div>

    <div id="panel-signin">
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Password" />
        </div>
        <button type="submit" class="btn btn-primary" id="btn-signin">Sign In</button>
      </form>
      <div id="magic-link-section" style="display:none">
        <div class="divider"><span>or</span></div>
        <button type="button" class="btn btn-secondary" id="btn-magic">Send Magic Link</button>
      </div>
    </div>

    <div id="panel-register" style="display:none">
      <form id="register-form">
        <div class="form-group">
          <label for="reg-name">Name</label>
          <input type="text" id="reg-name" placeholder="Your name" required />
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" placeholder="At least 8 characters" required minlength="8" />
        </div>
        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>
      <p id="reg-message" style="display:none"></p>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script type="module" src="./login.js"></script>
</body>
</html>
