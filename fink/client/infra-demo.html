<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fink Infrastructure Demo</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #0e1118;
  color: #d8dce6;
  font-family: 'Georgia', 'Palatino Linotype', serif;
  display: flex;
  justify-content: center;
  padding: 16px;
}

/* ── Layout ────────────────────────────────────────────── */
.app {
  width: 100%;
  max-width: 900px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* ── Top bar ───────────────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: #181c28;
  border-bottom: 1px solid #2d3348;
  border-radius: 6px 6px 0 0;
}
.topbar-logo {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: #c97040;
}
.topbar-sub {
  font-size: 11px;
  color: #5a5f74;
  font-style: italic;
}
.topbar-tabs {
  margin-left: auto;
  display: flex;
  gap: 4px;
}
.topbar-tab {
  padding: 5px 14px;
  font-size: 11px;
  font-family: inherit;
  background: transparent;
  border: 1px solid #2d3348;
  border-radius: 3px;
  color: #7a7f94;
  cursor: pointer;
  transition: all 0.15s;
}
.topbar-tab:hover { border-color: #c97040; color: #c97040; }
.topbar-tab.active { background: #252a3a; border-color: #c97040; color: #c97040; }

/* ── Main panels ───────────────────────────────────────── */
.main {
  display: flex;
  flex: 1;
  min-height: 0;
  background: #1a1f2e;
}
.panel-story {
  flex: 1;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #2d3348;
  min-width: 0;
}
.panel-infra {
  width: 320px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  background: #181c28;
  scrollbar-width: thin;
  scrollbar-color: #2d3348 transparent;
}

/* ── Story header ──────────────────────────────────────── */
.story-header {
  padding: 10px 16px;
  background: #1e2333;
  border-bottom: 1px solid #2d3348;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.story-title {
  font-size: 13px;
  font-weight: 700;
  color: #c97040;
  letter-spacing: 0.04em;
}
.story-knot {
  font-size: 11px;
  color: #4a4e63;
  font-style: italic;
}

/* ── Scene image ───────────────────────────────────────── */
.scene-image {
  flex-shrink: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #14171f;
  border-bottom: 1px solid #2d3348;
  min-height: 180px;
  max-height: 220px;
  overflow: hidden;
  position: relative;
}
.scene-image svg {
  width: 100%;
  height: 100%;
  max-height: 220px;
}
.scene-image .media-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 9px;
  padding: 2px 8px;
  background: rgba(201,112,64,0.25);
  border: 1px solid rgba(201,112,64,0.4);
  border-radius: 3px;
  color: #c97040;
  letter-spacing: 0.06em;
  font-family: monospace;
}

/* ── Narration ─────────────────────────────────────────── */
.narration {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scrollbar-width: thin;
  scrollbar-color: #2d3348 transparent;
}
.para {
  font-size: 15px;
  line-height: 1.65;
  opacity: 0;
  transform: translateY(4px);
  animation: fadeUp 0.3s ease forwards;
}
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

.speaker-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #8bb4e0;
  display: block;
  margin-bottom: 2px;
}

.para[data-mood="tense"]      { color: #d8c8a0; }
.para[data-mood="mysterious"] { color: #a0b8d8; font-style: italic; }
.para[data-mood="calm"]       { color: #a0d8b8; }
.para[data-mood="curious"]    { color: #c8c0d8; }
.para[data-mood="noir"]       { color: #c8b898; }
.para[data-mood="peaceful"]   { color: #a0d8b8; font-style: italic; }
.para[data-mood="warm"]       { color: #d8c0a0; }

.vizprom {
  font-size: 11px;
  color: #4a4e63;
  font-style: italic;
  padding: 6px 10px;
  background: rgba(255,255,255,0.02);
  border-left: 2px solid #2d3348;
  border-radius: 2px;
}

/* ── Choices ────────────────────────────────────────────── */
.choices {
  flex-shrink: 0;
  padding: 12px 16px;
  border-top: 1px solid #2d3348;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 40%;
  overflow-y: auto;
}
.choice-btn {
  display: flex;
  align-items: baseline;
  gap: 10px;
  width: 100%;
  text-align: left;
  padding: 10px 14px;
  background: #252a3a;
  border: 1px solid #2d3348;
  border-radius: 4px;
  color: #d8dce6;
  font-family: inherit;
  font-size: 14px;
  line-height: 1.4;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
}
.choice-btn:hover {
  background: #2e3450;
  border-color: #8a5030;
}
.choice-num {
  font-size: 11px;
  font-weight: 700;
  color: #c97040;
  min-width: 14px;
}
.choice-text { flex: 1; }
.choice-tags {
  display: flex;
  gap: 4px;
}
.choice-tag {
  font-size: 9px;
  padding: 1px 6px;
  border-radius: 2px;
  letter-spacing: 0.04em;
  font-family: monospace;
}
.choice-tag.risk-high { background: rgba(220,80,80,0.15); color: #d88080; border: 1px solid rgba(220,80,80,0.3); }
.choice-tag.risk-medium { background: rgba(220,180,80,0.15); color: #d8c080; border: 1px solid rgba(220,180,80,0.3); }
.choice-tag.skill { background: rgba(80,160,220,0.15); color: #80b8d8; border: 1px solid rgba(80,160,220,0.3); }
.choice-tag.mood { background: rgba(160,80,220,0.12); color: #b898d8; border: 1px solid rgba(160,80,220,0.25); }

.teaser {
  font-size: 12px;
  color: #3a3e53;
  font-style: italic;
  padding: 8px 14px;
  border: 1px dashed #2d3348;
  border-radius: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.teaser-lock {
  font-size: 14px;
  opacity: 0.4;
}

/* ── Timer bar ─────────────────────────────────────────── */
.timer-bar {
  height: 3px;
  background: #2d3348;
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 4px;
}
.timer-fill {
  height: 100%;
  background: #c97040;
  transition: width 0.1s linear;
}

/* ── Infra panel ───────────────────────────────────────── */
.infra-section {
  padding: 12px 14px;
  border-bottom: 1px solid #2d3348;
}
.infra-heading {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #5a6080;
  margin-bottom: 8px;
}
.infra-json {
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  font-size: 10px;
  line-height: 1.5;
  color: #8a8fa4;
  white-space: pre-wrap;
  word-break: break-all;
  background: #14171f;
  padding: 8px 10px;
  border-radius: 3px;
  border: 1px solid #1e2233;
  max-height: 300px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #2d3348 transparent;
}
.infra-json .jk { color: #8bb4e0; }
.infra-json .js { color: #a0d8a0; }
.infra-json .jn { color: #d8c0a0; }
.infra-json .jb { color: #d88080; }
.infra-json .jp { color: #5a6080; }

/* ── Streams panel ─────────────────────────────────────── */
.stream-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
}
.stream-name {
  font-size: 10px;
  font-family: monospace;
  color: #7a7f94;
  width: 70px;
  flex-shrink: 0;
}
.stream-bar {
  flex: 1;
  height: 12px;
  background: #14171f;
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}
.stream-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.4s ease;
}
.stream-fill.narration { background: #5a80b0; }
.stream-fill.ambient { background: #5a9a6a; }
.stream-fill.foley { background: #b07050; }
.stream-fill.choices { background: #9070a0; }
.stream-fill.image { background: #b0a050; }
.stream-state {
  font-size: 9px;
  font-family: monospace;
  width: 50px;
  text-align: right;
  flex-shrink: 0;
}
.stream-state.pending { color: #4a4e63; }
.stream-state.active { color: #a0d8a0; }
.stream-state.complete { color: #5a6080; }

/* ── Voice card ────────────────────────────────────────── */
.voice-card {
  display: flex;
  gap: 10px;
  padding: 8px 10px;
  background: #14171f;
  border-radius: 3px;
  border: 1px solid #1e2233;
  margin-bottom: 6px;
}
.voice-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  flex-shrink: 0;
  overflow: hidden;
  background: #232838;
}
.voice-avatar svg { width: 100%; height: 100%; }
.voice-info {
  flex: 1;
  min-width: 0;
}
.voice-name {
  font-size: 11px;
  font-weight: 700;
  color: #c97040;
}
.voice-desc {
  font-size: 10px;
  color: #5a6080;
  margin-top: 2px;
}
.voice-providers {
  display: flex;
  gap: 4px;
  margin-top: 4px;
}
.voice-provider {
  font-size: 8px;
  padding: 1px 5px;
  background: #252a3a;
  border-radius: 2px;
  color: #5a6080;
  font-family: monospace;
}

/* ── Status bar ────────────────────────────────────────── */
.statusbar {
  padding: 8px 16px;
  font-size: 12px;
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  letter-spacing: 0.02em;
  color: #b0b4c8;
  background: #181c28;
  border-top: 1px solid #2d3348;
  border-radius: 0 0 6px 6px;
  display: flex;
  gap: 16px;
  min-height: 32px;
  align-items: center;
}
.statusbar.error {
  color: #ff8080;
  background: #2a1a1a;
  border-top-color: #4a2020;
}
.statusbar.connecting {
  color: #d8c080;
  background: #2a2618;
  border-top-color: #4a4020;
}
.statusbar.connected {
  color: #80d8a0;
}

/* ── Mic button ───────────────────────────────────────── */
.mic-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: #252a3a;
  border: 1px solid #2d3348;
  border-radius: 4px;
  color: #7a7f94;
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
  transition: all 0.2s;
}
.mic-btn:hover { border-color: #c97040; color: #c97040; }
.mic-btn.listening {
  background: #2a1a1a;
  border-color: #d06040;
  color: #ff6040;
  animation: mic-pulse 1.5s ease-in-out infinite;
}
.mic-btn.listening .mic-label::after { content: ' (listening)'; }
@keyframes mic-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(208,96,64,0.3); }
  50% { box-shadow: 0 0 8px 2px rgba(208,96,64,0.3); }
}

/* ── Responsive ────────────────────────────────────────── */
@media (max-width: 700px) {
  .main { flex-direction: column; }
  .panel-infra { width: 100%; max-height: 300px; border-top: 1px solid #2d3348; }
  .panel-story { border-right: none; }
}

/* ── Click-to-enter overlay ───────────────────────────── */
.enter-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(12px) saturate(60%);
  -webkit-backdrop-filter: blur(12px) saturate(60%);
  background: rgba(14, 17, 24, 0.7);
  cursor: pointer;
  transition: opacity 0.4s ease;
}
.enter-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}
.enter-card {
  text-align: center;
  padding: 40px 60px;
  background: rgba(24, 28, 40, 0.85);
  border: 1px solid #2d3348;
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.enter-card .logo {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: #c97040;
  margin-bottom: 8px;
}
.enter-card .subtitle {
  font-size: 13px;
  color: #5a5f74;
  font-style: italic;
  margin-bottom: 24px;
}
.enter-card .cta {
  font-size: 15px;
  color: #8a8fa4;
  padding: 10px 28px;
  border: 1px solid #3d4358;
  border-radius: 6px;
  background: rgba(255,255,255,0.03);
  transition: all 0.2s;
}
.enter-overlay:hover .cta {
  border-color: #c97040;
  color: #c97040;
  background: rgba(201,112,64,0.08);
}
</style>
</head>
<body>
<div class="enter-overlay" id="enterOverlay">
  <div class="enter-card">
    <div class="logo">FINK</div>
    <div class="subtitle">interactive voice fiction</div>
    <div class="cta">click to enter</div>
  </div>
</div>

<div class="app" id="app">
  <div class="topbar">
    <span class="topbar-logo">FINK</span>
    <span class="topbar-sub">infrastructure demo</span>
    <button class="mic-btn" id="micBtn" title="Toggle hands-free mic">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11h-2z"/>
      </svg>
      <span class="mic-label" id="micLabel">Mic</span>
    </button>
    <div class="topbar-tabs">
      <button class="topbar-tab" data-story="toc">Stories</button>
      <button class="topbar-tab" data-story="garden">Enchanted Garden</button>
      <button class="topbar-tab" data-story="bigtop">Bigtop Briefing</button>
      <button class="topbar-tab active" data-story="radio">Radio Quiz</button>
    </div>
  </div>

  <div class="main">
    <div class="panel-story">
      <div class="story-header">
        <span class="story-title" id="storyTitle">Radio Foundation Quiz</span>
        <span class="story-knot" id="storyKnot">intro</span>
      </div>
      <div class="scene-image" id="sceneImage"></div>
      <div class="narration" id="narration"></div>
      <div class="choices" id="choices"></div>
    </div>
    <div class="panel-infra">
      <div class="infra-section">
        <div class="infra-heading">Active Voice</div>
        <div id="voicePanel"></div>
      </div>
      <div class="infra-section">
        <div class="infra-heading">Temporal Streams</div>
        <div id="streamsPanel"></div>
      </div>
      <div class="infra-section">
        <div class="infra-heading">ink_state (protocol)</div>
        <div class="infra-json" id="protocolPanel"></div>
      </div>
      <div class="infra-section">
        <div class="infra-heading">Media Descriptors</div>
        <div class="infra-json" id="mediaPanel"></div>
      </div>
    </div>
  </div>

  <div class="statusbar">
    <span id="statusText">connecting...</span>
    <span style="margin-left:auto" id="statusStreams"></span>
  </div>
</div>

<script src="./enter-overlay.js"></script>
<script src="./infra-demo.js"></script>
<script type="module" src="./infra-demo-modes.js"></script>
</body>
</html>
