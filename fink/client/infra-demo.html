<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fink Infrastructure Demo</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: #0e1118;
  color: #d8dce6;
  font-family: 'Georgia', 'Palatino Linotype', serif;
  display: flex;
  justify-content: center;
  padding: 0;
}

/* ── Layout ────────────────────────────────────────────── */
.app {
  width: 100%;
  max-width: 1100px;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ── Top bar ───────────────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: #181c28;
  border-bottom: 1px solid #2d3348;
  flex-shrink: 0;
  z-index: 10;
}
.topbar-logo {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: #c97040;
}
.topbar-sub {
  font-size: 11px;
  color: #5a5f74;
  font-style: italic;
}
.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
}
.topbar-tabs {
  display: flex;
  gap: 4px;
}
.topbar-tab {
  padding: 5px 12px;
  font-size: 11px;
  font-family: inherit;
  background: transparent;
  border: 1px solid #2d3348;
  border-radius: 3px;
  color: #7a7f94;
  cursor: pointer;
  transition: all 0.15s;
}
.topbar-tab:hover { border-color: #c97040; color: #c97040; }
.topbar-tab.active { background: #252a3a; border-color: #c97040; color: #c97040; }

.topbar-divider {
  width: 1px;
  height: 20px;
  background: #2d3348;
  margin: 0 4px;
}

.mode-toggle {
  padding: 4px 10px;
  font-size: 10px;
  font-family: 'SF Mono', 'Fira Code', monospace;
  letter-spacing: 0.06em;
  background: transparent;
  border: 1px solid #2d3348;
  border-radius: 3px;
  color: #5a6080;
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
}
.mode-toggle:hover { border-color: #5a80b0; color: #5a80b0; }
.mode-toggle.debug-active { background: #1a2a3a; border-color: #5a80b0; color: #8bb4e0; }

/* ── Main panels ───────────────────────────────────────── */
.main {
  display: flex;
  flex: 1;
  min-height: 0;
  background: #1a1f2e;
}
.panel-story {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}
.panel-infra {
  width: 320px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  background: #181c28;
  border-left: 1px solid #2d3348;
  scrollbar-width: thin;
  scrollbar-color: #2d3348 transparent;
  transition: width 0.25s ease, opacity 0.2s ease;
}
.app:not(.debug-mode) .panel-infra {
  width: 0;
  overflow: hidden;
  opacity: 0;
  border-left: none;
}

/* ── Story header ──────────────────────────────────────── */
.story-header {
  padding: 8px 16px;
  background: #1e2333;
  border-bottom: 1px solid #2d3348;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.story-title {
  font-size: 14px;
  font-weight: 700;
  color: #c97040;
  letter-spacing: 0.04em;
}
.story-knot {
  font-size: 11px;
  color: #4a4e63;
  font-style: italic;
}
.app:not(.debug-mode) .story-knot { display: none; }

/* ── Scene image ───────────────────────────────────────── */
.scene-image {
  flex-shrink: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #14171f;
  border-bottom: 1px solid #2d3348;
  min-height: 160px;
  max-height: 240px;
  overflow: hidden;
  position: relative;
  transition: max-height 0.3s ease;
}
.scene-image svg {
  width: 100%;
  height: 100%;
  max-height: 240px;
}
.scene-image .media-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 9px;
  padding: 2px 8px;
  background: rgba(201,112,64,0.25);
  border: 1px solid rgba(201,112,64,0.4);
  border-radius: 3px;
  color: #c97040;
  letter-spacing: 0.06em;
  font-family: monospace;
}
.app:not(.debug-mode) .scene-image .media-badge { display: none; }

/* ── Narration ─────────────────────────────────────────── */
.narration {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scrollbar-width: thin;
  scrollbar-color: #2d3348 transparent;
  -webkit-overflow-scrolling: touch;
}
.para {
  font-size: 16px;
  line-height: 1.7;
  opacity: 0;
  transform: translateY(4px);
  animation: fadeUp 0.3s ease forwards;
}
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

.speaker-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #8bb4e0;
  display: block;
  margin-bottom: 3px;
}

.para[data-mood="tense"]      { color: #d8c8a0; }
.para[data-mood="mysterious"] { color: #a0b8d8; font-style: italic; }
.para[data-mood="calm"]       { color: #a0d8b8; }
.para[data-mood="curious"]    { color: #c8c0d8; }
.para[data-mood="noir"]       { color: #c8b898; }
.para[data-mood="peaceful"]   { color: #a0d8b8; font-style: italic; }
.para[data-mood="warm"]       { color: #d8c0a0; }
.para[data-mood="melancholy"] { color: #b0b0d0; font-style: italic; }
.para[data-mood="hopeful"]    { color: #c8d8a0; }
.para[data-mood="dark"]       { color: #8a8a9a; }
.para[data-mood="whimsical"]  { color: #d0b8e0; }
.para[data-mood="resolute"]   { color: #d8d0c0; font-weight: 500; }

.vizprom {
  font-size: 11px;
  color: #4a4e63;
  font-style: italic;
  padding: 6px 10px;
  background: rgba(255,255,255,0.02);
  border-left: 2px solid #2d3348;
  border-radius: 2px;
}
.app:not(.debug-mode) .vizprom { display: none; }

/* ── Inline images in narration ────────────────────────── */
.narration-image {
  align-self: center;
  max-width: 80%;
  border-radius: 4px;
  overflow: hidden;
  opacity: 0;
  animation: fadeUp 0.4s ease 0.2s forwards;
}
.narration-image svg {
  width: 100%;
  display: block;
}
.narration-image-caption {
  font-size: 10px;
  color: #4a4e63;
  text-align: center;
  padding: 4px;
  font-style: italic;
}

/* ── Media indicators (normal mode) ────────────────────── */
.media-indicator {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 4px 0;
}
.media-chip {
  font-size: 9px;
  padding: 2px 8px;
  border-radius: 10px;
  font-family: 'SF Mono', monospace;
  letter-spacing: 0.04em;
}
.media-chip.audio { background: rgba(90,154,106,0.15); color: #5a9a6a; border: 1px solid rgba(90,154,106,0.3); }
.media-chip.foley { background: rgba(176,112,80,0.15); color: #b07050; border: 1px solid rgba(176,112,80,0.3); }
.media-chip.image { background: rgba(176,160,80,0.15); color: #b0a050; border: 1px solid rgba(176,160,80,0.3); }
.app.debug-mode .media-indicator { display: none; }

/* ── Choices ────────────────────────────────────────────── */
.choices {
  flex-shrink: 0;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  border-top: 1px solid #2d3348;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 45%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.choice-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  padding: 12px 16px;
  background: #252a3a;
  border: 1px solid #2d3348;
  border-radius: 6px;
  color: #d8dce6;
  font-family: inherit;
  font-size: 15px;
  line-height: 1.4;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.choice-btn:hover {
  background: #2e3450;
  border-color: #8a5030;
}
.choice-btn:active {
  transform: scale(0.98);
  background: #353a50;
}
.choice-num {
  font-size: 12px;
  font-weight: 700;
  color: #c97040;
  min-width: 18px;
  text-align: center;
}
.choice-text { flex: 1; }
.choice-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.choice-tag {
  font-size: 9px;
  padding: 1px 6px;
  border-radius: 2px;
  letter-spacing: 0.04em;
  font-family: monospace;
}
.choice-tag.risk-high { background: rgba(220,80,80,0.15); color: #d88080; border: 1px solid rgba(220,80,80,0.3); }
.choice-tag.risk-medium { background: rgba(220,180,80,0.15); color: #d8c080; border: 1px solid rgba(220,180,80,0.3); }
.choice-tag.risk-low { background: rgba(80,180,80,0.15); color: #80c080; border: 1px solid rgba(80,180,80,0.3); }
.choice-tag.skill { background: rgba(80,160,220,0.15); color: #80b8d8; border: 1px solid rgba(80,160,220,0.3); }
.choice-tag.mood { background: rgba(160,80,220,0.12); color: #b898d8; border: 1px solid rgba(160,80,220,0.25); }
.app:not(.debug-mode) .choice-tags { display: none; }

.teaser {
  font-size: 13px;
  color: #3a3e53;
  font-style: italic;
  padding: 10px 14px;
  border: 1px dashed #2d3348;
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.teaser-lock { font-size: 14px; opacity: 0.4; }

/* ── Timer bar ─────────────────────────────────────────── */
.timer-bar {
  height: 3px;
  background: #2d3348;
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 4px;
}
.timer-fill {
  height: 100%;
  background: #c97040;
  transition: width 0.1s linear;
}

/* ── Infra panel sections ─────────────────────────────── */
.infra-section {
  padding: 12px 14px;
  border-bottom: 1px solid #2d3348;
}
.infra-heading {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #5a6080;
  margin-bottom: 8px;
}
.infra-json {
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  font-size: 10px;
  line-height: 1.5;
  color: #8a8fa4;
  white-space: pre-wrap;
  word-break: break-all;
  background: #14171f;
  padding: 8px 10px;
  border-radius: 3px;
  border: 1px solid #1e2233;
  max-height: 300px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #2d3348 transparent;
}
.infra-json .jk { color: #8bb4e0; }
.infra-json .js { color: #a0d8a0; }
.infra-json .jn { color: #d8c0a0; }
.infra-json .jb { color: #d88080; }
.infra-json .jp { color: #5a6080; }

/* ── Streams panel ─────────────────────────────────────── */
.stream-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
}
.stream-name {
  font-size: 10px;
  font-family: monospace;
  color: #7a7f94;
  width: 70px;
  flex-shrink: 0;
}
.stream-bar {
  flex: 1;
  height: 12px;
  background: #14171f;
  border-radius: 2px;
  overflow: hidden;
}
.stream-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.4s ease;
}
.stream-fill.narration { background: #5a80b0; }
.stream-fill.ambient { background: #5a9a6a; }
.stream-fill.foley { background: #b07050; }
.stream-fill.choices { background: #9070a0; }
.stream-fill.image { background: #b0a050; }
.stream-state {
  font-size: 9px;
  font-family: monospace;
  width: 50px;
  text-align: right;
  flex-shrink: 0;
}
.stream-state.pending { color: #4a4e63; }
.stream-state.active { color: #a0d8a0; }
.stream-state.complete { color: #5a6080; }

/* ── Voice card ────────────────────────────────────────── */
.voice-card {
  display: flex;
  gap: 10px;
  padding: 8px 10px;
  background: #14171f;
  border-radius: 3px;
  border: 1px solid #1e2233;
  margin-bottom: 6px;
}
.voice-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  flex-shrink: 0;
  overflow: hidden;
  background: #232838;
}
.voice-avatar svg { width: 100%; height: 100%; }
.voice-info { flex: 1; min-width: 0; }
.voice-name { font-size: 11px; font-weight: 700; color: #c97040; }
.voice-desc { font-size: 10px; color: #5a6080; margin-top: 2px; }
.voice-providers { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.voice-provider {
  font-size: 8px;
  padding: 1px 5px;
  background: #252a3a;
  border-radius: 2px;
  color: #5a6080;
  font-family: monospace;
}

/* ── Status bar ────────────────────────────────────────── */
.statusbar {
  padding: 6px 16px;
  padding-bottom: max(6px, env(safe-area-inset-bottom));
  font-size: 10px;
  letter-spacing: 0.04em;
  color: #4a4e63;
  background: #181c28;
  border-top: 1px solid #2d3348;
  display: flex;
  gap: 16px;
  flex-shrink: 0;
}

/* ── Responsive: tablets ──────────────────────────────── */
@media (max-width: 900px) {
  .panel-infra { width: 280px; }
}

/* ── Responsive: mobile ───────────────────────────────── */
@media (max-width: 700px) {
  body { padding: 0; }
  .topbar { padding: 8px 12px; gap: 6px; flex-wrap: wrap; }
  .topbar-sub { display: none; }
  .topbar-tab { padding: 5px 10px; font-size: 10px; }
  .mode-toggle { padding: 4px 8px; font-size: 9px; }

  .main { flex-direction: column; }
  .app.debug-mode .panel-story { flex: 1; min-height: 40vh; }
  .panel-infra { width: 100% !important; border-left: none !important; border-top: 1px solid #2d3348; }
  .app.debug-mode .panel-infra {
    width: 100% !important;
    opacity: 1;
    max-height: 35vh;
    overflow-y: auto;
  }
  .app:not(.debug-mode) .panel-infra {
    width: 0 !important;
    height: 0;
    max-height: 0;
  }

  .scene-image { min-height: 120px; max-height: 160px; }
  .scene-image svg { max-height: 160px; }
  .narration { padding: 14px 16px; gap: 10px; }
  .para { font-size: 15px; line-height: 1.6; }
  .choices { padding: 10px 12px; gap: 6px; }
  .choice-btn { padding: 12px 14px; font-size: 14px; border-radius: 8px; }
  .narration-image { max-width: 95%; }
  .statusbar { padding: 5px 12px; font-size: 9px; }
  .story-header { padding: 6px 12px; }
}

/* ── Very small phones ────────────────────────────────── */
@media (max-width: 380px) {
  .topbar-tab { padding: 4px 8px; font-size: 9px; }
  .choice-btn { padding: 10px 12px; font-size: 13px; }
  .para { font-size: 14px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <span class="topbar-logo">FINK</span>
    <span class="topbar-sub">interactive fiction</span>
    <div class="topbar-right">
      <div class="topbar-tabs">
        <button class="topbar-tab active" data-story="garden">Garden</button>
        <button class="topbar-tab" data-story="bigtop">Bigtop</button>
      </div>
      <span class="topbar-divider"></span>
      <button class="mode-toggle" id="modeToggle" title="Toggle debug panel">debug</button>
    </div>
  </div>

  <div class="main">
    <div class="panel-story">
      <div class="story-header">
        <span class="story-title" id="storyTitle">The Enchanted Garden</span>
        <span class="story-knot" id="storyKnot">menu</span>
      </div>
      <div class="scene-image" id="sceneImage"></div>
      <div class="narration" id="narration"></div>
      <div class="choices" id="choices"></div>
    </div>
    <div class="panel-infra">
      <div class="infra-section">
        <div class="infra-heading">Active Voice</div>
        <div id="voicePanel"></div>
      </div>
      <div class="infra-section">
        <div class="infra-heading">Temporal Streams</div>
        <div id="streamsPanel"></div>
      </div>
      <div class="infra-section">
        <div class="infra-heading">ink_state (protocol)</div>
        <div class="infra-json" id="protocolPanel"></div>
      </div>
      <div class="infra-section">
        <div class="infra-heading">Media Descriptors</div>
        <div class="infra-json" id="mediaPanel"></div>
      </div>
    </div>
  </div>

  <div class="statusbar">
    <span id="statusText">tap a choice to begin</span>
    <span style="margin-left:auto" id="statusStreams"></span>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  Debug mode toggle
// ═══════════════════════════════════════════════════════════

let debugMode = false;
const appEl = document.getElementById("app");
const modeBtn = document.getElementById("modeToggle");

modeBtn.addEventListener("click", () => {
  debugMode = !debugMode;
  appEl.classList.toggle("debug-mode", debugMode);
  modeBtn.classList.toggle("debug-active", debugMode);
  modeBtn.textContent = debugMode ? "debug on" : "debug";
  // re-render current knot to update visibility
  if (currentKnotKey) enterKnot(currentKnotKey, true);
});

// ═══════════════════════════════════════════════════════════
//  Engine
// ═══════════════════════════════════════════════════════════

let currentStoryKey = "garden";
let currentKnotKey = "";
let vars = {};
let streamStates = {};
let timerInterval = null;

const $ = id => document.getElementById(id);

function switchStory(key) {
  currentStoryKey = key;
  const story = STORIES[key];
  vars = { ...story.vars };
  document.querySelectorAll('.topbar-tab').forEach(t => t.classList.toggle('active', t.dataset.story === key));
  enterKnot(story.startKnot);
}

function enterKnot(knotKey, isRerender) {
  if (knotKey === "_switch_bigtop") return switchStory("bigtop");
  if (knotKey === "_switch_garden") return switchStory("garden");

  const story = STORIES[currentStoryKey];
  const knot = story.knots[knotKey];
  if (!knot) return;

  // onEnter (skip on re-render)
  if (knot.onEnter && !isRerender) {
    const redirect = knot.onEnter(vars);
    if (redirect) return enterKnot(redirect);
  }

  currentKnotKey = knotKey;

  // Header
  $("storyTitle").textContent = story.title;
  $("storyKnot").textContent = knotKey;

  // Scene image (supports scene_fn for dynamic scenes)
  const sceneKey = (knot.scene_fn ? knot.scene_fn(vars) : knot.scene) || "";
  const sceneEl = $("sceneImage");
  if (sceneKey && SVG[sceneKey]) {
    sceneEl.innerHTML = SVG[sceneKey] + '<span class="media-badge">SVG scene</span>';
    sceneEl.style.display = "";
  } else {
    sceneEl.style.display = "none";
  }

  // Narration
  const narEl = $("narration");
  narEl.innerHTML = "";

  // Vizprom (debug only, hidden via CSS in normal mode)
  if (knot.vizprom) {
    const vp = document.createElement("div");
    vp.className = "vizprom";
    vp.textContent = "VIZPROM: " + knot.vizprom;
    narEl.appendChild(vp);
  }

  const paras = typeof knot.paragraphs === "function" ? knot.paragraphs(vars) : knot.paragraphs;
  const speaker = knot.speaker;
  const voice = story.voices[speaker];

  paras.forEach((text, i) => {
    const p = document.createElement("div");
    p.className = "para";
    if (knot.mood) p.dataset.mood = knot.mood;
    p.style.animationDelay = (i * 0.12) + "s";
    if (i === 0 && voice) {
      const lbl = document.createElement("span");
      lbl.className = "speaker-label";
      lbl.textContent = voice.name;
      p.appendChild(lbl);
    }
    p.appendChild(document.createTextNode(text));
    narEl.appendChild(p);
  });

  // Media indicators (normal mode) — show subtle chips for active media
  const media = knot.media || [];
  if (media.length > 0) {
    const ind = document.createElement("div");
    ind.className = "media-indicator";
    media.forEach(m => {
      const chip = document.createElement("span");
      chip.className = "media-chip " + m.type;
      if (m.type === "audio") chip.textContent = m.role === "ambient" ? "ambient" : "audio";
      else if (m.type === "foley") chip.textContent = m.name || "sfx";
      else if (m.type === "image") chip.textContent = "image";
      ind.appendChild(chip);
    });
    narEl.appendChild(ind);
  }

  narEl.scrollTop = narEl.scrollHeight;

  // Choices
  const choicesEl = $("choices");
  choicesEl.innerHTML = "";
  const choices = typeof knot.choices === "function" ? knot.choices(vars) : knot.choices;
  const teasers = knot.teasers || [];

  // Timer bar
  if (knot.timer && !isRerender) {
    const tb = document.createElement("div");
    tb.className = "timer-bar";
    tb.innerHTML = '<div class="timer-fill" id="timerFill" style="width:100%"></div>';
    choicesEl.appendChild(tb);
    startTimer(knot.timer.seconds, knot.timer.default_index, choices);
  } else if (!knot.timer) {
    clearTimer();
  }

  choices.forEach((c, i) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = `<span class="choice-num">${i + 1}</span><span class="choice-text">${c.text}</span>`;

    if (c.tags && Object.keys(c.tags).length > 0) {
      const tagsEl = document.createElement("span");
      tagsEl.className = "choice-tags";
      for (const [k, v] of Object.entries(c.tags)) {
        const tag = document.createElement("span");
        if (k === "risk") {
          tag.className = `choice-tag risk-${v}`;
          tag.textContent = `risk:${v}`;
        } else if (k === "skill") {
          tag.className = "choice-tag skill";
          tag.textContent = v;
        } else if (k === "mood") {
          tag.className = "choice-tag mood";
          tag.textContent = v;
        }
        tagsEl.appendChild(tag);
      }
      btn.appendChild(tagsEl);
    }

    btn.onclick = () => {
      clearTimer();
      if (c.onChoose) c.onChoose(vars);
      enterKnot(c.target);
    };
    choicesEl.appendChild(btn);
  });

  teasers.forEach(t => {
    const te = document.createElement("div");
    te.className = "teaser";
    te.innerHTML = `<span class="teaser-lock">&#x1f512;</span> ${t.teaser}`;
    choicesEl.appendChild(te);
  });

  // ── Infra panels (only update if debug mode is on, for performance) ──
  if (debugMode) {
    updateVoicePanel(speaker, voice);
    updateStreamsPanel(knot);
    updateProtocolPanel(knotKey, knot, paras, choices, teasers);
    updateMediaPanel(knot);
  }
  updateStatus(knotKey, knot);
}

function startTimer(seconds, defaultIdx, choices) {
  clearTimer();
  const start = Date.now();
  const duration = seconds * 1000;
  timerInterval = setInterval(() => {
    const elapsed = Date.now() - start;
    const pct = Math.max(0, 100 - (elapsed / duration * 100));
    const fill = document.getElementById("timerFill");
    if (fill) fill.style.width = pct + "%";
    if (elapsed >= duration) {
      clearTimer();
      const c = choices[defaultIdx] || choices[0];
      if (c) enterKnot(c.target);
    }
  }, 100);
}

function clearTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function updateVoicePanel(speaker, voice) {
  const el = $("voicePanel");
  if (!voice) { el.innerHTML = '<div style="font-size:10px;color:#4a4e63">no voice active</div>'; return; }
  el.innerHTML = `
    <div class="voice-card">
      <div class="voice-avatar">${SVG[voice.avatar] || ""}</div>
      <div class="voice-info">
        <div class="voice-name">${voice.name}</div>
        <div class="voice-desc">${voice.desc}</div>
        <div class="voice-providers">
          ${Object.entries(voice.providers).map(([k,v]) => `<span class="voice-provider">${k}: ${v}</span>`).join("")}
        </div>
      </div>
    </div>
  `;
}

function updateStreamsPanel(knot) {
  const media = knot.media || [];
  const hasAmbient = media.some(m => m.role === "ambient");
  const hasFoley = media.some(m => m.type === "foley");
  const hasImage = media.some(m => m.type === "image");

  streamStates = {
    narration: "active",
    ambient: hasAmbient ? "active" : "pending",
    foley: hasFoley ? "active" : "pending",
    choices: "pending",
    image: hasImage ? "active" : "pending"
  };

  setTimeout(() => {
    streamStates.narration = "complete";
    streamStates.choices = "active";
    if (streamStates.foley === "active") streamStates.foley = "complete";
    renderStreams();
  }, 800);

  renderStreams();
}

function renderStreams() {
  const el = $("streamsPanel");
  if (!el) return;
  const widths = { active: "70%", complete: "100%", pending: "0%" };
  el.innerHTML = Object.entries(streamStates).map(([name, state]) => `
    <div class="stream-row">
      <span class="stream-name">${name}</span>
      <div class="stream-bar">
        <div class="stream-fill ${name}" style="width:${widths[state]}"></div>
      </div>
      <span class="stream-state ${state}">${state}</span>
    </div>
  `).join("");
}

function syntaxHL(json) {
  return json
    .replace(/"([^"]+)":/g, '"<span class="jk">$1</span>":')
    .replace(/: "([^"]*)"/g, ': "<span class="js">$1</span>"')
    .replace(/: (\d+)/g, ': <span class="jn">$1</span>')
    .replace(/: (true|false|null)/g, ': <span class="jb">$1</span>');
}

function updateProtocolPanel(knotKey, knot, paras, choices, teasers) {
  const story = STORIES[currentStoryKey];
  const voice = story.voices[knot.speaker];
  const proto = {
    type: "ink_state",
    knot: knotKey,
    narration: paras.map((text, i) => ({
      text,
      speaker: i === 0 ? knot.speaker : undefined,
      voice: i === 0 && voice ? Object.values(voice.providers)[0] : undefined,
      mood: knot.mood || undefined
    })),
    choices: choices.map((c, i) => ({
      index: i,
      text: c.text,
      tags: Object.keys(c.tags).length > 0 ? c.tags : undefined
    })),
    hidden_teasers: teasers.length > 0 ? teasers : undefined,
    choice_mode: "guided",
    timer: knot.timer || undefined
  };
  $("protocolPanel").innerHTML = syntaxHL(JSON.stringify(proto, null, 2));
}

function updateMediaPanel(knot) {
  const media = knot.media || [];
  if (media.length === 0) {
    $("mediaPanel").innerHTML = '<span class="jp">// no media at this beat</span>';
    return;
  }
  const descriptors = media.map(m => {
    const d = { type: m.type };
    if (m.url) d.url = m.url;
    if (m.name) d.name = m.name;
    if (m.alt) d.alt = m.alt;
    if (m.role) d.role = m.role;
    if (m.loop) d.loop = m.loop;
    if (m.position) d.position = m.position;
    return d;
  });
  $("mediaPanel").innerHTML = syntaxHL(JSON.stringify(descriptors, null, 2));
}

function updateStatus(knotKey, knot) {
  const mediaCount = (knot.media || []).length;
  if (debugMode) {
    const varStr = Object.entries(vars).map(([k,v]) => `${k}=${v}`).join("  ");
    $("statusText").textContent = `knot: ${knotKey}  |  media: ${mediaCount}  |  ${varStr}`;
    $("statusStreams").textContent = "choice_mode: guided";
  } else {
    const story = STORIES[currentStoryKey];
    $("statusText").textContent = story.title;
    $("statusStreams").textContent = "";
  }
}


// ── Init ──
document.querySelectorAll('.topbar-tab').forEach(btn => {
  btn.addEventListener('click', () => switchStory(btn.dataset.story));
});

switchStory("garden");
</script>
